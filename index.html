<script>
'use strict';const KEY='swimbetter-training-v1';const today=()=>{const d=new Date();return [d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-')};const uid=()=>String(Date.now())+Math.random().toString(36).slice(2,6);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const addDays=(d,n)=>{let x=new Date(d+'T12:00:00');x.setDate(x.getDate()+n);return x.toISOString().slice(0,10)};const weekStart=d=>{let x=new Date(d+'T12:00:00');return addDays(d,-((x.getDay()+6)%7))};const fmt=d=>new Date(d+'T12:00:00').toLocaleDateString('da-DK',{day:'numeric',month:'short'});const weekdays=['Mandag','Tirsdag','Onsdag','Torsdag','Fredag','Lørdag','Søndag'];
const defaultData={sessions:[{id:'base1',date:'2026-10-28',type:'Styrke',title:'Styrke og stabilitet',duration:'40–50 min',details:'Kontrolleret styrke med fokus på core, ryg og skulderstabilitet. Tilpas til skulder og knæ. Undgå udtrætning før kvalitetspas.',status:'planlagt',rpe:'',notes:''},{id:'base2',date:'2026-10-29',type:'Bassin',title:'Konkurrencefart – 100/250/500 m',duration:'Ca. 60 min · 2.200 m',details:'Bassinpas – vejledende, tilpas efter dagsform.\n400 m rolig opvarmning inkl. 4 × 50 m teknik.\n4 × 50 m progressivt, 20 sek. pause.\n3 × (3 × 100 m) på 2:00 start; kontrolleret, jævn fart omkring 1:37–1:40/100 m, 1 min ekstra mellem blokke.\n4 × 50 m med 25 m frisk 100 m-følelse + 25 m let, 25 sek. pause.\n300 m roligt med fokus på flydende catch.\n200 m afsvømning.\nFokus: hold længde i taget uden dødpause. Ingen maksimal sprint. Justér efter lørdagens belastning.',status:'planlagt',rpe:'',notes:''},{id:'base3',date:'2026-10-31',type:'Bassin',title:'Tri-klub – klubbens program',duration:'Ca. 2.500 m',details:'Følg klubbens program med teknik og intervaller. Registrér oplevet belastning efterfølgende.',status:'planlagt',rpe:'',notes:''},{id:'base4',date:'2026-11-01',type:'Styrke',title:'Weekendstyrke – fleksibel',duration:'30–45 min',details:'Let til moderat funktionel styrke. Kan flyttes til lørdag. Søndagsbassin er valgfrit og let.',status:'planlagt',rpe:'',notes:''}],events:[{id:'e1',name:'Silbersee',date:'2026-11-28',endDate:'2026-11-29',note:'28.–29. november 2026 · Dato skal bekræftes hos arrangøren.',priority:'Forberedende konkurrence',url:'https://internationaliceswimming.com/events-calendar/',confirmed:false},{id:'e2',name:'DM Faaborg',date:'2027-01-29',endDate:'2027-01-31',note:'29.–31. januar 2027 · Afventer endelig bekræftelse.',priority:'Vigtig konkurrence',url:'https://internationaliceswimming.com/events-calendar/',confirmed:false},{id:'e3',name:'EM Gdynia',date:'2027-02-03',endDate:'2027-02-07',note:'3.–7. februar 2027 · Kontrollér dato med arrangøren.',priority:'Hovedmål',url:'https://gwsc.pl/',confirmed:false},{id:'e4',name:'VM Argentina · El Calafate',date:'2028-08-01',endDate:'',note:'August 2028 · Dato endnu ikke bekræftet.',priority:'Langsigtet mål',url:'https://majetusz.hu/en/competitions?circuit=iwsa',confirmed:false}]};let data;try{const saved=JSON.parse(localStorage.getItem(KEY));data=saved&&Array.isArray(saved.sessions)&&Array.isArray(saved.events)?saved:structuredClone(defaultData)}catch{data=structuredClone(defaultData)}const eventDefaults=defaultData.events;for(const template of eventDefaults){let existing=data.events.find(e=>e.id===template.id);if(!existing){data.events.push({...template})}else if(!existing.userEdited){Object.assign(existing,template)}}data.events=data.events.filter(e=>!/oradea|rumænien|romania/i.test(e.name||''));save();let tab='Ugeplan',week=weekStart(today()),editId=null,menuOpen=false;function save(){localStorage.setItem(KEY,JSON.stringify(data))}function switchTab(t){tab=t;menuOpen=false;render()}function render(){document.getElementById('menuItems').innerHTML=['Ugeplan','Træningslog','Konkurrencer','Import / backup'].map(t=>`<button class="${t===tab?'active':''}" data-tab="${esc(t)}">${esc(t)}</button>`).join('');document.getElementById('menuItems').classList.toggle('hidden',!menuOpen);document.getElementById('menuToggle').setAttribute('aria-expanded',String(menuOpen));document.getElementById('menuToggle').onclick=()=>{menuOpen=!menuOpen;render()};document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>switchTab(b.dataset.tab));const v=document.getElementById('view');v.innerHTML=tab==='Ugeplan'?weekView():tab==='Træningslog'?logView():tab==='Konkurrencer'?eventView():importView();wire()}
function programMarkup(details){const lines=String(details||'').split(/\n+/).map(x=>x.trim()).filter(Boolean);if(!lines.length)return '<p class="muted">Intet program angivet endnu.</p>';const labels=['Opvarmning','Teknik / forberedelse','Hovedserie','Fartkontrol','Rolig svømning','Afsvømning'];const isSwimLine=x=>/^(?:\d+\s*(?:×|x)\s*)?(?:\(.*\)\s*)?\d+\s*m\b|^\d+\s*×\s*\(/i.test(x);let chunks=[];for(let i=0;i<lines.length;i++){let line=lines[i];let label='Program';if(/opvarmning/i.test(line))label='Opvarmning';else if(/afsvømning/i.test(line))label='Afsvømning';else if(/fokus:/i.test(line))label='Teknisk fokus';else if(/progressivt|teknik/i.test(line))label='Teknik / forberedelse';else if(/3\s*×\s*\(|hovedserie/i.test(line))label='Hovedserie';else if(/frisk|fartkontrol/i.test(line))label='Fartkontrol';else if(/roligt/i.test(line)&&isSwimLine(line))label='Rolig svømning';else if(i===0&&!isSwimLine(line))label='Om passet';chunks.push('<div class="program-step"><div class="step-title">'+esc(label)+'</div><div class="step-content">'+esc(line)+'</div></div>')}return '<div class="program-steps">'+chunks.join('')+'</div>'} 
function sessionCard(s){let isDone=s.status==='gennemført';return `<details class="session ${isDone?'done':''}"><summary><div class="session-head"><div><div class="session-meta">${esc(s.type)} · ${esc(s.duration||'Varighed ikke angivet')}</div><strong>${esc(s.title)}</strong></div><span class="chevron">⌄</span></div></summary><div class="session-body">${programMarkup(s.details)}${(['Open water','Issvømning'].includes(s.type)&& (s.swimMeters||s.waterTemp||s.waterType))?`<div class="water-summary">${s.swimMeters?esc(s.swimMeters)+' m · ':''}${s.waterTemp!==undefined&&s.waterTemp!==''?esc(s.waterTemp)+' °C · ':''}${s.waterType?esc(s.waterType)+' · ':''}${paceText(s)!=='–'?'Pace '+paceText(s):''}</div>`:''}<div class="mini muted">${esc(s.status)}${s.rpe?' · Belastning '+esc(s.rpe)+'/10':''}${s.notes?' · '+esc(s.notes):''}</div>${s.type==='Cykling'?`<div class="mini muted">${esc(s.cycleKind||'')} ${s.distanceKm?'· '+esc(s.distanceKm)+' km':''} ${s.avgSpeed?'· '+esc(s.avgSpeed)+' km/t':''}</div>`:''}<div class="actions"><button data-edit="${esc(s.id)}">Redigér / flyt</button><button data-done="${esc(s.id)}">${isDone?'Fortryd gennemført':'Markér gennemført'}</button><button data-delete="${esc(s.id)}" class="danger">Slet</button></div></div></details>`}
function weekView(){let list=data.sessions.filter(s=>s.date>=week&&s.date<=addDays(week,6));return `<details class="hero"><summary><span class="tag">Næste mål</span><strong>Silbersee · november 2026</strong><span>⌄</span></summary><p>Fokus på 100 m, 200/250 m og 450/500 m. Dato og deltagelse er foreløbig.</p></details><div class="panel week-heading"><div class="row"><div><div class="tag">Ugeplan</div><h2>${fmt(week)} – ${fmt(addDays(week,6))}</h2></div><div class="week-nav"><button id="prev">← Forrige</button><button id="current">Denne uge</button><button id="next">Næste →</button></div></div><p class="muted">Tryk på et pas for at se programmet. Flyt træning efter dagsform og restitution.</p><button class="primary" id="new">+ Planlæg / registrér træning</button></div><div class="grid">${weekdays.map((day,i)=>{let date=addDays(week,i),ss=list.filter(s=>s.date===date);return `<div class="panel day-panel ${ss.length?'':'empty-day'}"><div class="row"><h3>${day}</h3><span class="mini muted">${fmt(date)}</span></div>${ss.length?ss.map(sessionCard).join(''):'<span class="muted day-empty">Ingen planlagte pas</span>'}</div>`}).join('')}</div>${formHtml()}`}
function logView(){let done=data.sessions.filter(s=>s.status==='gennemført').sort((a,b)=>b.date.localeCompare(a.date));return `<div class="panel"><div class="tag">Træningslog</div><h2>Din gennemførte træning</h2><p class="muted">${done.length} registrerede pas · Registrér belastning og noter via Redigér.</p><button id="new" class="primary">+ Registrér pas</button></div>${done.length?done.map(s=>`<div class="panel"><div class="row"><strong>${esc(s.title)}</strong><span>${fmt(s.date)}</span></div><p class="muted">${esc(s.type)} · ${esc(s.duration)} · Belastning ${esc(s.rpe||'–')}/10</p><p>${esc(s.notes||'Ingen noter')}</p><button data-edit="${esc(s.id)}">Redigér</button></div>`).join(''):'<div class="panel muted">Ingen gennemførte pas endnu.</div>'}${formHtml()}`}
function eventView(){return `<div class="panel"><div class="tag">Konkurrencekalender</div><h2>Mine konkurrencer</h2><p class="muted">Datoer markeret foreløbige skal bekræftes hos arrangørerne. Du kan redigere datoer og links.</p></div>${[...data.events].sort((a,b)=>a.date.localeCompare(b.date)).map(e=>`<div class="panel"><span class="pill">${esc(e.priority||'Konkurrence')}</span><h2 style="margin-top:10px">${esc(e.name)}</h2><strong>${fmt(e.date)}${e.endDate?' – '+fmt(e.endDate):''} ${e.date.slice(0,4)}</strong><p class="muted">${e.confirmed?'Bekræftet':'Foreløbig dato'}</p><p>${esc(e.note||'')}</p><div class="actions">${e.url?`<a class="btn" href="${esc(e.url)}" target="_blank" rel="noopener noreferrer">Event / tilmelding ↗</a>`:''}<button data-event-edit="${esc(e.id)}">Redigér event</button></div></div>`).join('')}<div id="eventEditor" class="panel hidden"><h2>Redigér konkurrence</h2><form id="eventForm"><label>Navn<input name="name" required></label><div class="grid"><label>Startdato<input type="date" name="date" required></label><label>Slutdato<input type="date" name="endDate"></label></div><label>Eventlink<input name="url" type="url" placeholder="https://..."></label><label>Bemærkning<textarea name="note"></textarea></label><label><input type="checkbox" name="confirmed" style="width:auto"> Dato bekræftet</label><div class="actions"><button class="primary" type="submit">Gem konkurrence</button><button type="button" id="eventCancel">Fortryd</button></div></form></div>`}
function importView(){return `<div class="panel"><div class="tag">Programmer fra ChatGPT</div><h2>Importér træningspas</h2><p>Indsæt JSON med et eller flere pas. Import tilføjer pas til ugeplanen uden at overskrive dine eksisterende registreringer.</p><textarea id="json" placeholder='{"sessions":[{"date":"2026-10-29","type":"Bassin","title":"Torsdag – teknik og pace","duration":"60 min","details":"Opvarmning ..."}]}'></textarea><div class="actions"><button class="primary" id="import">Importér pas</button><button id="example">Vis eksempel</button></div><p id="importmsg" class="muted"></p></div><div class="panel"><h2>Sikkerhedskopi</h2><p class="muted">Eksportér alle dine programmer og træningsregistreringer som JSON. Brug filen til at gendanne på en anden enhed.</p><div class="actions"><button id="export">Download sikkerhedskopi</button><label style="margin:0"><span class="btn" style="display:inline-block">Gendan fra fil</span><input id="restore" type="file" accept="application/json,.json" style="display:none"></label></div><p class="notice">Vigtigt: Gendannelse erstatter den aktuelle lokale database. Gem en sikkerhedskopi først.</p></div>`}

function paceText(s){let meters=Number(s.swimMeters),secs=Number(s.swimMinutes)*60+Number(s.swimSeconds);if(!(meters>0&&secs>0))return '–';let p=Math.round(secs*100/meters);return Math.floor(p/60)+':'+String(p%60).padStart(2,'0')+' /100 m'}
function updatePacePreview(){let f=document.getElementById('sessionForm'),e=document.getElementById('pacePreview');if(f&&e)e.textContent='Pace: '+paceText({...Object.fromEntries(new FormData(f).entries()),swimMeters:f.elements.swimMeters.value==='custom'?f.elements.swimMetersCustom.value:f.elements.swimMeters.value})}
function updateCustomDistance(){let f=document.getElementById('sessionForm'),e=document.getElementById('customDistance');if(f&&e){let custom=f.elements.swimMeters.value==='custom';e.classList.toggle('hidden',!custom);e.required=custom}}function updateTypeFields(){let f=document.getElementById('sessionForm');if(f){let e=document.getElementById('cyclingFields');if(e)e.classList.toggle('hidden',f.elements.type.value!=='Cykling');let w=document.getElementById('waterFields');if(w)w.classList.toggle('hidden',!['Bassin','Open water','Issvømning'].includes(f.elements.type.value));let d=document.getElementById('durationField');if(d)d.classList.toggle('hidden',['Bassin','Open water','Issvømning'].includes(f.elements.type.value));updatePacePreview()}}function wire(){const on=(id,fn)=>{let e=document.getElementById(id);if(e)e.onclick=fn};on('prev',()=>{week=addDays(week,-7);render()});on('next',()=>{week=addDays(week,7);render()});on('current',()=>{week=weekStart(today());render()});on('new',()=>openForm(null));on('close',()=>document.getElementById('editor').classList.add('hidden'));document.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>openForm(b.dataset.edit));document.querySelectorAll('[data-done]').forEach(b=>b.onclick=()=>{let s=data.sessions.find(x=>x.id===b.dataset.done);s.status=s.status==='gennemført'?'planlagt':'gennemført';save();render()});document.querySelectorAll('[data-delete]').forEach(b=>b.onclick=()=>{if(confirm('Slet dette træningspas?')){data.sessions=data.sessions.filter(x=>x.id!==b.dataset.delete);save();render()}});document.querySelectorAll('[data-event-edit]').forEach(b=>b.onclick=()=>{let e=data.events.find(x=>x.id===b.dataset.eventEdit),panel=document.getElementById('eventEditor'),f=document.getElementById('eventForm');if(!e)return;panel.classList.remove('hidden');for(let k of ['name','date','endDate','url','note'])f.elements[k].value=e[k]||'';f.elements.confirmed.checked=!!e.confirmed;f.onsubmit=ev=>{ev.preventDefault();for(let k of ['name','date','endDate','url','note'])e[k]=f.elements[k].value;e.confirmed=f.elements.confirmed.checked;e.userEdited=true;save();render()};document.getElementById('eventCancel').onclick=()=>panel.classList.add('hidden');panel.scrollIntoView({behavior:'smooth'})});let f=document.getElementById('sessionForm');if(f){f.elements.type.onchange=updateTypeFields;f.addEventListener('input',updatePacePreview);f.addEventListener('change',()=>{updateCustomDistance();updatePacePreview()});f.onsubmit=e=>{e.preventDefault();let obj=Object.fromEntries(new FormData(f).entries());obj.id=editId||uid();if(obj.swimMeters==='custom')obj.swimMeters=obj.swimMetersCustom;delete obj.swimMetersCustom;if(['Bassin','Open water','Issvømning'].includes(obj.type)){let meters=Number(obj.swimMeters),seconds=Number(obj.swimMinutes)*60+Number(obj.swimSeconds);obj.duration=[meters>0?meters.toLocaleString('da-DK')+' m':'',seconds>0?Math.floor(seconds/60)+':'+String(seconds%60).padStart(2,'0')+' min':''].filter(Boolean).join(' · ')||obj.duration||'';}if(editId)data.sessions=data.sessions.map(s=>s.id===editId?obj:s);else data.sessions.push(obj);save();week=weekStart(obj.date);render()}};on('example',()=>{document.getElementById('json').value=JSON.stringify({sessions:[{date:'2026-10-29',type:'Bassin',title:'Eksempel – målrettet bassin',duration:'60 min',details:'Erstat med dit aftalte program.\nOpvarmning: ...\nHovedserie: ...\nAfsvømning: ...'}]},null,2)});on('import',()=>{let msg=document.getElementById('importmsg');try{let parsed=JSON.parse(document.getElementById('json').value);let sessions=Array.isArray(parsed)?parsed:parsed.sessions;if(!Array.isArray(sessions)||!sessions.length||sessions.length>100)throw Error('Forventede 1–100 træningspas');let clean=sessions.map(s=>{if(!/^\d{4}-\d{2}-\d{2}$/.test(s.date)||!s.title||!s.type)throw Error('Hvert pas skal have date (ÅÅÅÅ-MM-DD), title og type');return {id:uid(),date:s.date,type:String(s.type),title:String(s.title),duration:String(s.duration||''),details:String(s.details||''),status:'planlagt',rpe:'',notes:'',cycleKind:String(s.cycleKind||''),distanceKm:String(s.distanceKm||''),avgSpeed:String(s.avgSpeed||''),avgHr:String(s.avgHr||''),swimMeters:String(s.swimMeters||''),waterTemp:String(s.waterTemp??''),waterType:String(s.waterType||''),swimMinutes:String(s.swimMinutes||''),swimSeconds:String(s.swimSeconds||''),waterMinutes:String(s.waterMinutes||''),waterLocation:String(s.waterLocation||'')}});data.sessions.push(...clean);save();week=weekStart(clean[0].date);tab='Ugeplan';render();alert(clean.length+' pas importeret')}catch(e){msg.textContent='Import mislykkedes: '+e.message}});on('export',()=>{let blob=new Blob([JSON.stringify({version:1,exportedAt:new Date().toISOString(),...data},null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='SwimBetter-Training-backup-'+today()+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)});let restore=document.getElementById('restore');if(restore)restore.onchange=async()=>{try{let o=JSON.parse(await restore.files[0].text());if(!Array.isArray(o.sessions)||!Array.isArray(o.events))throw Error('Ugyldig backup');if(!confirm('Erstat alle lokale data med denne backup?'))return;data={sessions:o.sessions,events:o.events};save();render();alert('Backup gendannet')}catch(e){alert('Kunne ikke gendanne: '+e.message)}}}render();
