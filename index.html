<!doctype html><html lang="da"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#123b50"><title>SwimBetter Training · 1.1</title><style>
:root{--navy:#123b50;--blue:#236b86;--ice:#e7f3f6;--bg:#f4f8f9;--ink:#17313f;--muted:#627783;--line:#dce8ec}*{box-sizing:border-box}body{margin:0;font:15px/1.5 system-ui,-apple-system,Segoe UI,sans-serif;background:var(--bg);color:var(--ink)}header{background:linear-gradient(125deg,#10384d,#2b718b);color:white;padding:26px max(20px,calc((100vw - 1060px)/2));}header small{letter-spacing:3px;opacity:.8}h1{margin:2px 0;font-size:31px;letter-spacing:-1px}header p{margin:0;opacity:.83}.wrap{max-width:1060px;margin:auto;padding:22px 16px 70px}.tabs{display:flex;gap:8px;overflow:auto;padding-bottom:12px}.tabs button{white-space:nowrap}.btn,button{font:inherit;cursor:pointer;border:1px solid var(--line);background:white;border-radius:10px;padding:9px 13px;color:var(--ink)}button.primary,.active{background:var(--navy)!important;color:white!important;border-color:var(--navy)!important}button:hover{filter:brightness(.97)}.panel{background:white;border:1px solid var(--line);border-radius:16px;padding:20px;margin:12px 0;box-shadow:0 5px 20px #133b5010}.row{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}.muted{color:var(--muted)}h2{font-size:20px;margin:0 0 10px}h3{font-size:16px;margin:0 0 6px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}.pill{display:inline-block;border-radius:99px;background:var(--ice);color:var(--blue);font-size:12px;padding:4px 9px}.session{border:1px solid var(--line);border-radius:12px;padding:14px;margin:9px 0}.session.done{opacity:.65}.session p{white-space:pre-wrap;margin:6px 0}.mini{font-size:12px}.actions{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}input,select,textarea{width:100%;border:1px solid #cbdce2;border-radius:9px;padding:10px;font:inherit;background:white;color:var(--ink)}textarea{min-height:110px;resize:vertical}label{display:block;font-weight:600;margin:10px 0 5px}form .grid{gap:10px}.hidden{display:none!important}.notice{background:var(--ice);border-radius:12px;padding:12px;color:#28536a}.stat{font-size:24px;font-weight:750}.tag{color:#426b7c;font-size:12px;font-weight:600;letter-spacing:.5px;text-transform:uppercase}footer{font-size:12px;color:var(--muted);margin-top:25px}pre{white-space:pre-wrap;overflow-wrap:anywhere}.danger{color:#a33c3c} @media(max-width:520px){header{padding:22px 17px}h1{font-size:27px}.panel{padding:15px}.wrap{padding:15px 12px 55px}}

/* SwimBetter 1.1 refinement */
:root{--navy:#102f40;--blue:#276781;--ice:#eaf3f6;--bg:#f5f8fa;--ink:#173340;--muted:#607581;--line:#dbe7ed}
body{font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased}
header{background:linear-gradient(125deg,#102f40 0%,#1e5269 75%,#316d85 100%);padding-top:32px;padding-bottom:32px}
header small{font-size:10px;font-weight:700;letter-spacing:4px;color:#b9d9e5}
header h1{font-size:37px;font-weight:750;margin:0;line-height:1.15}
header p{margin-top:9px;color:#d0e3eb}
.wrap{max-width:930px;padding-top:16px}
.tabs{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:7px;padding:3px 0 8px;overflow:visible}
.tabs button{min-width:0;white-space:normal;min-height:49px;border-radius:12px;padding:9px 6px;font-size:13px;font-weight:650;line-height:1.2}
.panel{border-radius:17px;box-shadow:0 6px 24px #123b5009;padding:19px}
.grid{grid-template-columns:1fr;gap:0}
.grid>.panel{margin:5px 0;padding:14px 17px}
.grid>.panel> .row h3{margin:0;font-size:15px}
.grid>.panel> .row{padding-bottom:3px}
.session{background:#f8fbfc;border-color:#e2ebef;margin:9px 0;padding:15px}
.session h3{font-size:16px;line-height:1.35}
.session p{font-size:14px;color:#365361}
.pill{background:#e4f1f6;color:#215f7a;font-weight:650}
button{transition:background .15s ease,border-color .15s ease;touch-action:manipulation}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:3px solid #7db5cb;outline-offset:2px}
button.primary,.active{background:#17475d!important;border-color:#17475d!important}
.notice{background:#e9f3f7}
footer{border-top:1px solid var(--line);padding-top:16px;line-height:1.7}
.hero{background:linear-gradient(130deg,#123c52,#215a72);color:#fff;border-radius:18px;padding:21px;margin:12px 0 15px;box-shadow:0 10px 28px #173d531c}
.hero .tag{color:#a8cfdd}.hero h2{font-size:22px;margin:4px 0}.hero p{margin:4px 0;color:#d4e6ee;font-size:14px}
.hero .pill{background:#ffffff1b;color:#e9f8ff;border:1px solid #ffffff30}
.week-heading{margin-top:5px}.week-heading h2{font-size:21px}
.week-nav{display:flex;gap:6px;flex-wrap:wrap}.week-nav button{font-size:13px;padding:8px 10px}
.day-empty{font-size:12px;margin:8px 0 1px}
@media(max-width:520px){header{padding:25px 18px 27px}header h1{font-size:33px}.wrap{padding:13px 12px 50px}.panel{padding:16px}.tabs{gap:5px}.tabs button{font-size:11px;min-height:49px;padding:7px 3px}.week-nav{width:100%;display:grid;grid-template-columns:1fr 1fr 1fr}.week-nav button{font-size:12px;padding:9px 3px}.hero{padding:18px}.hero h2{font-size:21px}.actions button{font-size:13px}.grid>.panel{padding:13px 14px}}
</style></head><body><header><small>SWIMBETTER</small><h1>Training</h1><p>Find dit flow · Træn målrettet · Svøm bedre</p></header><main class="wrap"><nav class="tabs" id="tabs"></nav><section id="view"></section><footer>Version 1.1 · Data gemmes kun i denne browser. Eksportér jævnligt en sikkerhedskopi. Ingen automatisk synkronisering mellem enheder.</footer></main>
<script>
'use strict';const KEY='swimbetter-training-v1';const today=()=>{const d=new Date();return [d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-')};const uid=()=>String(Date.now())+Math.random().toString(36).slice(2,6);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const addDays=(d,n)=>{let x=new Date(d+'T12:00:00');x.setDate(x.getDate()+n);return x.toISOString().slice(0,10)};const weekStart=d=>{let x=new Date(d+'T12:00:00');return addDays(d,-((x.getDay()+6)%7))};const fmt=d=>new Date(d+'T12:00:00').toLocaleDateString('da-DK',{day:'numeric',month:'short'});const weekdays=['Mandag','Tirsdag','Onsdag','Torsdag','Fredag','Lørdag','Søndag'];
const defaultData={sessions:[{id:'base1',date:'2026-10-28',type:'Styrke',title:'Styrke og stabilitet',duration:'40–50 min',details:'Kontrolleret styrke med fokus på core, ryg og skulderstabilitet. Tilpas til skulder og knæ. Undgå udtrætning før kvalitetspas.',status:'planlagt',rpe:'',notes:''},{id:'base2',date:'2026-10-29',type:'Bassin',title:'Konkurrencefart – 100/250/500 m',duration:'Ca. 60 min · 2.200 m',details:'Bassinpas – vejledende, tilpas efter dagsform.\n400 m rolig opvarmning inkl. 4 × 50 m teknik.\n4 × 50 m progressivt, 20 sek. pause.\n3 × (3 × 100 m) på 2:00 start; kontrolleret, jævn fart omkring 1:37–1:40/100 m, 1 min ekstra mellem blokke.\n4 × 50 m med 25 m frisk 100 m-følelse + 25 m let, 25 sek. pause.\n300 m roligt med fokus på flydende catch.\n200 m afsvømning.\nFokus: hold længde i taget uden dødpause. Ingen maksimal sprint. Justér efter lørdagens belastning.',status:'planlagt',rpe:'',notes:''},{id:'base3',date:'2026-10-31',type:'Bassin',title:'Tri-klub – klubbens program',duration:'Ca. 2.500 m',details:'Følg klubbens program med teknik og intervaller. Registrér oplevet belastning efterfølgende.',status:'planlagt',rpe:'',notes:''},{id:'base4',date:'2026-11-01',type:'Styrke',title:'Weekendstyrke – fleksibel',duration:'30–45 min',details:'Let til moderat funktionel styrke. Kan flyttes til lørdag. Søndagsbassin er valgfrit og let.',status:'planlagt',rpe:'',notes:''}],events:[{id:'e1',name:'Silbersee',date:'2026-11-28',note:'Sidst i november – dato er foreløbig. Ikke tilmeldt. Forventet: 50, 100, 250, 500 m.',priority:'Forberedende konkurrence'},{id:'e2',name:'DM Faaborg',date:'2027-01-30',note:'Sidste weekend i januar. Distancer afventer.',priority:'Vigtig konkurrence'},{id:'e3',name:'EM Gdynia',date:'2027-02-06',note:'Ugen efter DM – dato er foreløbig. 50, 100, 200, 450 m.',priority:'Hovedmål'}]};let data;try{const saved=JSON.parse(localStorage.getItem(KEY));data=saved&&Array.isArray(saved.sessions)&&Array.isArray(saved.events)?saved:structuredClone(defaultData)}catch{data=structuredClone(defaultData)}let tab='Ugeplan',week=weekStart(today()),editId=null;function save(){localStorage.setItem(KEY,JSON.stringify(data))}function switchTab(t){tab=t;render()}function render(){document.getElementById('tabs').innerHTML=['Ugeplan','Træningslog','Konkurrencer','Import / backup'].map(t=>`<button class="${t===tab?'active':''}" data-tab="${esc(t)}">${esc(t)}</button>`).join('');document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>switchTab(b.dataset.tab));const v=document.getElementById('view');v.innerHTML=tab==='Ugeplan'?weekView():tab==='Træningslog'?logView():tab==='Konkurrencer'?eventView():importView();wire()}
function sessionCard(s){return `<article class="session ${s.status==='gennemført'?'done':''}"><div class="row"><span class="pill">${esc(s.type)}</span><span class="mini muted">${esc(s.duration||'')}</span></div><h3 style="margin-top:9px">${esc(s.title)}</h3><p>${esc(s.details)}</p><div class="mini muted">${esc(s.status)}${s.rpe?' · Belastning '+esc(s.rpe)+'/10':''}${s.notes?' · '+esc(s.notes):''}</div><div class="actions"><button data-edit="${esc(s.id)}">Redigér / flyt</button><button data-done="${esc(s.id)}">${s.status==='gennemført'?'Fortryd gennemført':'Markér gennemført'}</button><button data-delete="${esc(s.id)}" class="danger">Slet</button></div></article>`}
function weekView(){let list=data.sessions.filter(s=>s.date>=week&&s.date<=addDays(week,6));return `<div class="hero"><div class="tag">Næste mål</div><h2>Silbersee · november 2026</h2><p>Fokus på 100 m, 200/250 m og 450/500 m. Dato og deltagelse er foreløbig.</p><span class="pill">Målet er ikke at svømme mere – men bedre</span></div><div class="panel week-heading"><div class="row"><div><div class="tag">Ugeplan</div><h2>${fmt(week)} – ${fmt(addDays(week,6))}</h2></div><div class="week-nav"><button id="prev">← Forrige</button><button id="current">Denne uge</button><button id="next">Næste →</button></div></div><p class="muted">Flyt pas efter arbejde og restitution. Udendørssvømning er valgfri og styres af forhold og sikkerhed.</p><button class="primary" id="new">+ Nyt træningspas</button></div><div class="grid">${weekdays.map((day,i)=>{let date=addDays(week,i),ss=list.filter(s=>s.date===date);return `<div class="panel"><div class="row"><h3>${day}</h3><span class="mini muted">${fmt(date)}</span></div>${ss.length?ss.map(sessionCard).join(''):'<p class="muted day-empty">Fri / fleksibel dag</p>'}</div>`}).join('')}</div>${formHtml()}`}
function logView(){let done=data.sessions.filter(s=>s.status==='gennemført').sort((a,b)=>b.date.localeCompare(a.date));return `<div class="panel"><div class="tag">Træningslog</div><h2>Din gennemførte træning</h2><p class="muted">${done.length} registrerede pas · Registrér belastning og noter via Redigér.</p><button id="new" class="primary">+ Registrér pas</button></div>${done.length?done.map(s=>`<div class="panel"><div class="row"><strong>${esc(s.title)}</strong><span>${fmt(s.date)}</span></div><p class="muted">${esc(s.type)} · ${esc(s.duration)} · Belastning ${esc(s.rpe||'–')}/10</p><p>${esc(s.notes||'Ingen noter')}</p><button data-edit="${esc(s.id)}">Redigér</button></div>`).join(''):'<div class="panel muted">Ingen gennemførte pas endnu.</div>'}${formHtml()}`}
function eventView(){return `<div class="panel"><div class="tag">Konkurrencekalender</div><h2>Vejen mod EM</h2><p class="muted">Datoer mærket foreløbige skal bekræftes med arrangørerne.</p></div>${data.events.sort((a,b)=>a.date.localeCompare(b.date)).map(e=>`<div class="panel"><span class="pill">${esc(e.priority)}</span><h2 style="margin-top:10px">${esc(e.name)}</h2><strong>${fmt(e.date)} ${new Date(e.date+'T12:00:00').getFullYear()}</strong><p>${esc(e.note)}</p></div>`).join('')}`}
function importView(){return `<div class="panel"><div class="tag">Programmer fra ChatGPT</div><h2>Importér træningspas</h2><p>Indsæt JSON med et eller flere pas. Import tilføjer pas til ugeplanen uden at overskrive dine eksisterende registreringer.</p><textarea id="json" placeholder='{"sessions":[{"date":"2026-10-29","type":"Bassin","title":"Torsdag – teknik og pace","duration":"60 min","details":"Opvarmning ..."}]}'></textarea><div class="actions"><button class="primary" id="import">Importér pas</button><button id="example">Vis eksempel</button></div><p id="importmsg" class="muted"></p></div><div class="panel"><h2>Sikkerhedskopi</h2><p class="muted">Eksportér alle dine programmer og træningsregistreringer som JSON. Brug filen til at gendanne på en anden enhed.</p><div class="actions"><button id="export">Download sikkerhedskopi</button><label style="margin:0"><span class="btn" style="display:inline-block">Gendan fra fil</span><input id="restore" type="file" accept="application/json,.json" style="display:none"></label></div><p class="notice">Vigtigt: Gendannelse erstatter den aktuelle lokale database. Gem en sikkerhedskopi først.</p></div>`}
function formHtml(){return `<div id="editor" class="panel hidden"><div class="row"><h2 id="formtitle">Træningspas</h2><button id="close">Luk</button></div><form id="sessionForm"><label>Dato<input type="date" name="date" required></label><div class="grid"><div><label>Type<select name="type"><option>Bassin</option><option>Open water</option><option>Styrke</option><option>Cardio</option><option>Restitution</option><option>Andet</option></select></label></div><div><label>Varighed / distance<input name="duration" placeholder="60 min · 2.000 m"></label></div></div><label>Overskrift<input name="title" required></label><label>Program – sæt / pauser / tekniske cues<textarea name="details"></textarea></label><div class="grid"><div><label>Status<select name="status"><option value="planlagt">Planlagt</option><option value="gennemført">Gennemført</option><option value="sprunget over">Sprunget over</option></select></label></div><div><label>Oplevet belastning (1–10)<input name="rpe" type="number" min="1" max="10" placeholder="Valgfrit"></label></div></div><label>Noter efter træning<textarea name="notes" placeholder="Dagsform, tempo, vandtemperatur, restitution ..."></textarea></label><button class="primary" type="submit">Gem træningspas</button></form></div>`}
function openForm(id){editId=id||null;let s=data.sessions.find(s=>s.id===id)||{date:week,type:'Bassin',title:'',duration:'',details:'',status:'planlagt',rpe:'',notes:''};let f=document.getElementById('sessionForm');Object.keys(s).forEach(k=>{if(f.elements[k])f.elements[k].value=s[k]});document.getElementById('editor').classList.remove('hidden');document.getElementById('formtitle').textContent=id?'Redigér træningspas':'Nyt træningspas';document.getElementById('editor').scrollIntoView({behavior:'smooth',block:'start'})}
function wire(){const on=(id,fn)=>{let e=document.getElementById(id);if(e)e.onclick=fn};on('prev',()=>{week=addDays(week,-7);render()});on('next',()=>{week=addDays(week,7);render()});on('current',()=>{week=weekStart(today());render()});on('new',()=>openForm(null));on('close',()=>document.getElementById('editor').classList.add('hidden'));document.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>openForm(b.dataset.edit));document.querySelectorAll('[data-done]').forEach(b=>b.onclick=()=>{let s=data.sessions.find(x=>x.id===b.dataset.done);s.status=s.status==='gennemført'?'planlagt':'gennemført';save();render()});document.querySelectorAll('[data-delete]').forEach(b=>b.onclick=()=>{if(confirm('Slet dette træningspas?')){data.sessions=data.sessions.filter(x=>x.id!==b.dataset.delete);save();render()}});let f=document.getElementById('sessionForm');if(f)f.onsubmit=e=>{e.preventDefault();let obj=Object.fromEntries(new FormData(f).entries());obj.id=editId||uid();if(editId)data.sessions=data.sessions.map(s=>s.id===editId?obj:s);else data.sessions.push(obj);save();week=weekStart(obj.date);render()};on('example',()=>{document.getElementById('json').value=JSON.stringify({sessions:[{date:'2026-10-29',type:'Bassin',title:'Eksempel – målrettet bassin',duration:'60 min',details:'Erstat med dit aftalte program.\nOpvarmning: ...\nHovedserie: ...\nAfsvømning: ...'}]},null,2)});on('import',()=>{let msg=document.getElementById('importmsg');try{let parsed=JSON.parse(document.getElementById('json').value);let sessions=Array.isArray(parsed)?parsed:parsed.sessions;if(!Array.isArray(sessions)||!sessions.length||sessions.length>100)throw Error('Forventede 1–100 træningspas');let clean=sessions.map(s=>{if(!/^\d{4}-\d{2}-\d{2}$/.test(s.date)||!s.title||!s.type)throw Error('Hvert pas skal have date (ÅÅÅÅ-MM-DD), title og type');return {id:uid(),date:s.date,type:String(s.type),title:String(s.title),duration:String(s.duration||''),details:String(s.details||''),status:'planlagt',rpe:'',notes:''}});data.sessions.push(...clean);save();week=weekStart(clean[0].date);tab='Ugeplan';render();alert(clean.length+' pas importeret')}catch(e){msg.textContent='Import mislykkedes: '+e.message}});on('export',()=>{let blob=new Blob([JSON.stringify({version:1,exportedAt:new Date().toISOString(),...data},null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='SwimBetter-Training-backup-'+today()+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)});let restore=document.getElementById('restore');if(restore)restore.onchange=async()=>{try{let o=JSON.parse(await restore.files[0].text());if(!Array.isArray(o.sessions)||!Array.isArray(o.events))throw Error('Ugyldig backup');if(!confirm('Erstat alle lokale data med denne backup?'))return;data={sessions:o.sessions,events:o.events};save();render();alert('Backup gendannet')}catch(e){alert('Kunne ikke gendanne: '+e.message)}}}render();
</script></body></html>
