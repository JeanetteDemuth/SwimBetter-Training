header{padding-top:20px;padding-bottom:19px}header h1{font-size:29px}header p{font-size:12px;margin-top:4px}.tabs{display:block;padding:0;margin:0 0 12px}.nav-top{display:flex;align-items:center;justify-content:space-between;background:#fff;border:1px solid var(--line);border-radius:14px;padding:8px 12px}.nav-brand{font-size:11px;letter-spacing:1.4px;color:#668391}.nav-brand b{display:block;letter-spacing:0;font-size:16px;color:#173340}.menu-toggle{background:#173f54;color:white;border:0;min-height:40px;padding:7px 13px}.menu-items{display:grid;grid-template-columns:repeat(2,1fr);gap:7px;margin-top:8px;background:white;padding:9px;border:1px solid var(--line);border-radius:13px}.menu-items button{min-height:42px}.hero{margin:7px 0 10px;padding:13px 16px}.hero summary{display:flex;align-items:center;gap:10px;cursor:pointer;list-style:none}.hero summary::-webkit-details-marker{display:none}.hero summary strong{flex:1;font-size:15px}.hero summary .tag{font-size:10px}.hero p{margin:10px 0}.week-heading{padding:14px}.week-heading h2{font-size:18px;margin:3px 0}.week-heading .muted{font-size:12px;margin:8px 0}.day-panel{margin:5px 0!important;padding:10px 12px!important}.day-panel>.row{padding:0!important}.day-panel h3{font-size:14px!important}.day-panel.empty-day{padding:8px 12px!important;display:flex;align-items:center;justify-content:space-between}.day-panel.empty-day .day-empty{display:none}.session{padding:0;margin:8px 0 0;border-radius:11px;overflow:hidden;background:#f8fbfd}.session summary{list-style:none;cursor:pointer;padding:11px 12px}.session summary::-webkit-details-marker{display:none}.session-head{display:flex;align-items:center;justify-content:space-between;gap:8px}.session-head strong{font-size:14px;display:block}.session-meta{font-size:11px;color:#537484;margin-bottom:3px}.chevron{font-size:19px;color:#597b8b;transition:transform .2s}.session[open] .chevron{transform:rotate(180deg)}.session-body{padding:0 12px 12px;border-top:1px solid #e3edf0}.session-body p{white-space:pre-wrap}.session.done{opacity:.7}.cycle-fields{background:#edf6f8;border-radius:12px;padding:10px;margin:10px 0}.actions button{min-height:39px}.grid{gap:0}@media(max-width:520px){header{padding:16px 16px 17px}header h1{font-size:27px}.wrap{padding-top:9px}.week-nav{grid-template-columns:repeat(3,1fr)}.week-nav button{font-size:11px}.hero{padding:12px}.hero summary{flex-wrap:wrap}.hero summary .tag{width:100%}}

/* SwimBetter 1.3 – unified header, legible workout steps */
header{padding:14px 18px!important} .header-inner{max-width:930px;margin:auto;display:flex;align-items:center;gap:14px}.header-copy{min-width:0;flex:1}header .header-copy small{font-size:9px}header .header-copy h1{font-size:25px;line-height:1.1}header .header-copy p{font-size:11px;margin-top:3px}.menu-toggle{display:flex;align-items:center;justify-content:center;gap:8px;min-width:48px;min-height:48px;border:1px solid #ffffff4d!important;background:#ffffff18!important;color:white!important;border-radius:12px;font-size:20px;padding:8px 11px}.menu-toggle span{font-size:12px}.tabs{margin:0}.menu-items{margin:0 0 10px;box-shadow:0 12px 30px #102f4014}.wrap{padding-top:12px}.program-steps{display:grid;gap:9px;margin:12px 0}.program-step{background:white;border:1px solid #dfebef;border-radius:11px;padding:12px}.program-step .step-title{font-size:11px;text-transform:uppercase;letter-spacing:.9px;font-weight:800;color:#286981;margin-bottom:5px}.program-step .step-content{font-size:15px;line-height:1.5;white-space:pre-wrap;overflow-wrap:anywhere}.program-step .step-content strong{font-size:17px}.program-intro{font-size:12px;color:#617884;margin:11px 0}.session-body{padding-top:4px}.session-body .actions{border-top:1px solid #e3edf0;padding-top:12px}.session-body .actions button{flex:1;min-width:95px}.week-heading .row{align-items:flex-start}.week-heading .week-nav{width:100%;display:grid;grid-template-columns:repeat(3,minmax(0,1fr))}.week-heading .week-nav button{padding:8px 3px}.day-panel.empty-day{padding:7px 12px!important}.day-panel.empty-day h3{font-weight:600;color:#6c8290}.session summary{padding:12px}.session-head strong{line-height:1.3}.form-buttons{display:flex;gap:10px;margin-top:15px}.form-buttons button{flex:1;min-height:46px}@media(min-width:700px){header{padding:19px 26px!important}.header-copy h1{font-size:29px!important}.week-heading .week-nav{width:auto;display:flex}}
</style></head><body><header><div class="header-inner"><button id="menuToggle" class="menu-toggle" aria-expanded="false" aria-controls="menuItems" aria-label="Åbn menu">☰ <span>Menu</span></button><div class="header-copy"><small>SWIMBETTER</small><h1>Training</h1><p>Find dit flow · Træn målrettet · Svøm bedre</p></div></div></header><main class="wrap"><nav class="tabs" id="tabs"><div id="menuItems" class="menu-items hidden"></div></nav><section id="view"></section><footer>Version 1.3 · Data gemmes kun i denne browser. Eksportér jævnligt en sikkerhedskopi. Ingen automatisk synkronisering mellem enheder.</footer></main>
<script>
'use strict';const KEY='swimbetter-training-v1';const today=()=>{const d=new Date();return [d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-')};const uid=()=>String(Date.now())+Math.random().toString(36).slice(2,6);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const addDays=(d,n)=>{let x=new Date(d+'T12:00:00');x.setDate(x.getDate()+n);return x.toISOString().slice(0,10)};const weekStart=d=>{let x=new Date(d+'T12:00:00');return addDays(d,-((x.getDay()+6)%7))};const fmt=d=>new Date(d+'T12:00:00').toLocaleDateString('da-DK',{day:'numeric',month:'short'});const weekdays=['Mandag','Tirsdag','Onsdag','Torsdag','Fredag','Lørdag','Søndag'];
const defaultData={sessions:[{id:'base1',date:'2026-10-28',type:'Styrke',title:'Styrke og stabilitet',duration:'40–50 min',details:'Kontrolleret styrke med fokus på core, ryg og skulderstabilitet. Tilpas til skulder og knæ. Undgå udtrætning før kvalitetspas.',status:'planlagt',rpe:'',notes:''},{id:'base2',date:'2026-10-29',type:'Bassin',title:'Konkurrencefart – 100/250/500 m',duration:'Ca. 60 min · 2.200 m',details:'Bassinpas – vejledende, tilpas efter dagsform.\n400 m rolig opvarmning inkl. 4 × 50 m teknik.\n4 × 50 m progressivt, 20 sek. pause.\n3 × (3 × 100 m) på 2:00 start; kontrolleret, jævn fart omkring 1:37–1:40/100 m, 1 min ekstra mellem blokke.\n4 × 50 m med 25 m frisk 100 m-følelse + 25 m let, 25 sek. pause.\n300 m roligt med fokus på flydende catch.\n200 m afsvømning.\nFokus: hold længde i taget uden dødpause. Ingen maksimal sprint. Justér efter lørdagens belastning.',status:'planlagt',rpe:'',notes:''},{id:'base3',date:'2026-10-31',type:'Bassin',title:'Tri-klub – klubbens program',duration:'Ca. 2.500 m',details:'Følg klubbens program med teknik og intervaller. Registrér oplevet belastning efterfølgende.',status:'planlagt',rpe:'',notes:''},{id:'base4',date:'2026-11-01',type:'Styrke',title:'Weekendstyrke – fleksibel',duration:'30–45 min',details:'Let til moderat funktionel styrke. Kan flyttes til lørdag. Søndagsbassin er valgfrit og let.',status:'planlagt',rpe:'',notes:''}],events:[{id:'e1',name:'Silbersee',date:'2026-11-28',note:'Sidst i november – dato er foreløbig. Ikke tilmeldt. Forventet: 50, 100, 250, 500 m.',priority:'Forberedende konkurrence'},{id:'e2',name:'DM Faaborg',date:'2027-01-30',note:'Sidste weekend i januar. Distancer afventer.',priority:'Vigtig konkurrence'},{id:'e3',name:'EM Gdynia',date:'2027-02-06',note:'Ugen efter DM – dato er foreløbig. 50, 100, 200, 450 m.',priority:'Hovedmål'}]};let data;try{const saved=JSON.parse(localStorage.getItem(KEY));data=saved&&Array.isArray(saved.sessions)&&Array.isArray(saved.events)?saved:structuredClone(defaultData)}catch{data=structuredClone(defaultData)}let tab='Ugeplan',week=weekStart(today()),editId=null,menuOpen=false;function save(){localStorage.setItem(KEY,JSON.stringify(data))}function switchTab(t){tab=t;menuOpen=false;render()}function render(){document.getElementById('menuItems').innerHTML=['Ugeplan','Træningslog','Konkurrencer','Import / backup'].map(t=>`<button class="${t===tab?'active':''}" data-tab="${esc(t)}">${esc(t)}</button>`).join('');document.getElementById('menuItems').classList.toggle('hidden',!menuOpen);document.getElementById('menuToggle').setAttribute('aria-expanded',String(menuOpen));document.getElementById('menuToggle').onclick=()=>{menuOpen=!menuOpen;render()};document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>switchTab(b.dataset.tab));const v=document.getElementById('view');v.innerHTML=tab==='Ugeplan'?weekView():tab==='Træningslog'?logView():tab==='Konkurrencer'?eventView():importView();wire()}
function programMarkup(details){const lines=String(details||'').split(/\n+/).map(x=>x.trim()).filter(Boolean);if(!lines.length)return '<p class="muted">Intet program angivet endnu.</p>';const labels=['Opvarmning','Teknik / forberedelse','Hovedserie','Fartkontrol','Rolig svømning','Afsvømning'];const isSwimLine=x=>/^(?:\d+\s*(?:×|x)\s*)?(?:\(.*\)\s*)?\d+\s*m\b|^\d+\s*×\s*\(/i.test(x);let chunks=[];for(let i=0;i<lines.length;i++){let line=lines[i];let label='Program';if(/opvarmning/i.test(line))label='Opvarmning';else if(/afsvømning/i.test(line))label='Afsvømning';else if(/fokus:/i.test(line))label='Teknisk fokus';else if(/progressivt|teknik/i.test(line))label='Teknik / forberedelse';else if(/3\s*×\s*\(|hovedserie/i.test(line))label='Hovedserie';else if(/frisk|fartkontrol/i.test(line))label='Fartkontrol';else if(/roligt/i.test(line)&&isSwimLine(line))label='Rolig svømning';else if(i===0&&!isSwimLine(line))label='Om passet';chunks.push('<div class="program-step"><div class="step-title">'+esc(label)+'</div><div class="step-content">'+esc(line)+'</div></div>')}return '<div class="program-steps">'+chunks.join('')+'</div>'} 
function sessionCard(s){let isDone=s.status==='gennemført';return `<details class="session ${isDone?'done':''}"><summary><div class="session-head"><div><div class="session-meta">${esc(s.type)} · ${esc(s.duration||'Varighed ikke angivet')}</div><strong>${esc(s.title)}</strong></div><span class="chevron">⌄</span></div></summary><div class="session-body">${programMarkup(s.details)}<div class="mini muted">${esc(s.status)}${s.rpe?' · Belastning '+esc(s.rpe)+'/10':''}${s.notes?' · '+esc(s.notes):''}</div>${s.type==='Cykling'?`<div class="mini muted">${esc(s.cycleKind||'')} ${s.distanceKm?'· '+esc(s.distanceKm)+' km':''} ${s.avgSpeed?'· '+esc(s.avgSpeed)+' km/t':''}</div>`:''}<div class="actions"><button data-edit="${esc(s.id)}">Redigér / flyt</button><button data-done="${esc(s.id)}">${isDone?'Fortryd gennemført':'Markér gennemført'}</button><button data-delete="${esc(s.id)}" class="danger">Slet</button></div></div></details>`}
function weekView(){let list=data.sessions.filter(s=>s.date>=week&&s.date<=addDays(week,6));return `<details class="hero"><summary><span class="tag">Næste mål</span><strong>Silbersee · november 2026</strong><span>⌄</span></summary><p>Fokus på 100 m, 200/250 m og 450/500 m. Dato og deltagelse er foreløbig.</p><span class="pill">Målet er ikke at svømme mere – men bedre</span></details><div class="panel week-heading"><div class="row"><div><div class="tag">Ugeplan</div><h2>${fmt(week)} – ${fmt(addDays(week,6))}</h2></div><div class="week-nav"><button id="prev">← Forrige</button><button id="current">Denne uge</button><button id="next">Næste →</button></div></div><p class="muted">Tryk på et pas for at se programmet. Flyt træning efter dagsform og restitution.</p><button class="primary" id="new">+ Planlæg / registrér træning</button></div><div class="grid">${weekdays.map((day,i)=>{let date=addDays(week,i),ss=list.filter(s=>s.date===date);return `<div class="panel day-panel ${ss.length?'':'empty-day'}"><div class="row"><h3>${day}</h3><span class="mini muted">${fmt(date)}</span></div>${ss.length?ss.map(sessionCard).join(''):'<span class="muted day-empty">Ingen planlagte pas</span>'}</div>`}).join('')}</div>${formHtml()}`}
function logView(){let done=data.sessions.filter(s=>s.status==='gennemført').sort((a,b)=>b.date.localeCompare(a.date));return `<div class="panel"><div class="tag">Træningslog</div><h2>Din gennemførte træning</h2><p class="muted">${done.length} registrerede pas · Registrér belastning og noter via Redigér.</p><button id="new" class="primary">+ Registrér pas</button></div>${done.length?done.map(s=>`<div class="panel"><div class="row"><strong>${esc(s.title)}</strong><span>${fmt(s.date)}</span></div><p class="muted">${esc(s.type)} · ${esc(s.duration)} · Belastning ${esc(s.rpe||'–')}/10</p><p>${esc(s.notes||'Ingen noter')}</p><button data-edit="${esc(s.id)}">Redigér</button></div>`).join(''):'<div class="panel muted">Ingen gennemførte pas endnu.</div>'}${formHtml()}`}
function eventView(){return `<div class="panel"><div class="tag">Konkurrencekalender</div><h2>Vejen mod EM</h2><p class="muted">Datoer mærket foreløbige skal bekræftes med arrangørerne.</p></div>${data.events.sort((a,b)=>a.date.localeCompare(b.date)).map(e=>`<div class="panel"><span class="pill">${esc(e.priority)}</span><h2 style="margin-top:10px">${esc(e.name)}</h2><strong>${fmt(e.date)} ${new Date(e.date+'T12:00:00').getFullYear()}</strong><p>${esc(e.note)}</p></div>`).join('')}`}
function importView(){return `<div class="panel"><div class="tag">Programmer fra ChatGPT</div><h2>Importér træningspas</h2><p>Indsæt JSON med et eller flere pas. Import tilføjer pas til ugeplanen uden at overskrive dine eksisterende registreringer.</p><textarea id="json" placeholder='{"sessions":[{"date":"2026-10-29","type":"Bassin","title":"Torsdag – teknik og pace","duration":"60 min","details":"Opvarmning ..."}]}'></textarea><div class="actions"><button class="primary" id="import">Importér pas</button><button id="example">Vis eksempel</button></div><p id="importmsg" class="muted"></p></div><div class="panel"><h2>Sikkerhedskopi</h2><p class="muted">Eksportér alle dine programmer og træningsregistreringer som JSON. Brug filen til at gendanne på en anden enhed.</p><div class="actions"><button id="export">Download sikkerhedskopi</button><label style="margin:0"><span class="btn" style="display:inline-block">Gendan fra fil</span><input id="restore" type="file" accept="application/json,.json" style="display:none"></label></div><p class="notice">Vigtigt: Gendannelse erstatter den aktuelle lokale database. Gem en sikkerhedskopi først.</p></div>`}
function formHtml(){return `<div id="editor" class="panel hidden"><div class="row"><h2 id="formtitle">Træningspas</h2></div><form id="sessionForm"><label>Dato<input type="date" name="date" required></label><div class="grid"><div><label>Type<select name="type"><option>Bassin</option><option>Open water</option><option>Styrke</option><option>Cykling</option><option>Cardio</option><option>Restitution</option><option>Andet</option></select></label></div><div><label>Varighed / distance<input name="duration" placeholder="60 min · 2.000 m"></label></div></div><div id="cyclingFields" class="cycle-fields hidden"><label>Type cykling<select name="cycleKind"><option value="">Vælg type</option><option>Gravel</option><option>Landevej</option><option>Spinning / indendørs</option><option>Andet</option></select></label><div class="grid"><div><label>Distance (km)<input type="number" step="0.1" min="0" name="distanceKm" placeholder="Valgfrit"></label></div><div><label>Gns. hastighed (km/t)<input type="number" step="0.1" min="0" name="avgSpeed" placeholder="Valgfrit"></label></div></div><label>Gennemsnitspuls<input type="number" min="0" max="240" name="avgHr" placeholder="Valgfrit"></label></div><label>Overskrift<input name="title" required></label><label>Program – sæt / pauser / tekniske cues<textarea name="details"></textarea></label><div class="grid"><div><label>Status<select name="status"><option value="planlagt">Planlagt</option><option value="gennemført">Gennemført</option><option value="sprunget over">Sprunget over</option></select></label></div><div><label>Oplevet belastning (1–10)<input name="rpe" type="number" min="1" max="10" placeholder="Valgfrit"></label></div></div><label>Noter efter træning<textarea name="notes" placeholder="Dagsform, tempo, vandtemperatur, restitution ..."></textarea></label><div class="form-buttons"><button class="primary" type="submit">Gem træningspas</button><button type="button" id="close">Fortryd</button></div></form></div>`}
function openForm(id){editId=id||null;let s=data.sessions.find(s=>s.id===id)||{date:week,type:'Bassin',title:'',duration:'',details:'',status:'planlagt',rpe:'',notes:'',cycleKind:'',distanceKm:'',avgSpeed:'',avgHr:''};if(!id&&tab==='Træningslog')s.status='gennemført';let f=document.getElementById('sessionForm');Object.keys(s).forEach(k=>{if(f.elements[k])f.elements[k].value=s[k]});document.getElementById('editor').classList.remove('hidden');updateTypeFields();document.getElementById('formtitle').textContent=id?'Redigér træningspas':'Nyt træningspas';document.getElementById('editor').scrollIntoView({behavior:'smooth',block:'start'})}
function updateTypeFields(){let f=document.getElementById('sessionForm');if(f){let e=document.getElementById('cyclingFields');if(e)e.classList.toggle('hidden',f.elements.type.value!=='Cykling')}}function wire(){const on=(id,fn)=>{let e=document.getElementById(id);if(e)e.onclick=fn};on('prev',()=>{week=addDays(week,-7);render()});on('next',()=>{week=addDays(week,7);render()});on('current',()=>{week=weekStart(today());render()});on('new',()=>openForm(null));on('close',()=>document.getElementById('editor').classList.add('hidden'));document.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>openForm(b.dataset.edit));document.querySelectorAll('[data-done]').forEach(b=>b.onclick=()=>{let s=data.sessions.find(x=>x.id===b.dataset.done);s.status=s.status==='gennemført'?'planlagt':'gennemført';save();render()});document.querySelectorAll('[data-delete]').forEach(b=>b.onclick=()=>{if(confirm('Slet dette træningspas?')){data.sessions=data.sessions.filter(x=>x.id!==b.dataset.delete);save();render()}});let f=document.getElementById('sessionForm');if(f){f.elements.type.onchange=updateTypeFields;f.onsubmit=e=>{e.preventDefault();let obj=Object.fromEntries(new FormData(f).entries());obj.id=editId||uid();if(editId)data.sessions=data.sessions.map(s=>s.id===editId?obj:s);else data.sessions.push(obj);save();week=weekStart(obj.date);render()}};on('example',()=>{document.getElementById('json').value=JSON.stringify({sessions:[{date:'2026-10-29',type:'Bassin',title:'Eksempel – målrettet bassin',duration:'60 min',details:'Erstat med dit aftalte program.\nOpvarmning: ...\nHovedserie: ...\nAfsvømning: ...'}]},null,2)});on('import',()=>{let msg=document.getElementById('importmsg');try{let parsed=JSON.parse(document.getElementById('json').value);let sessions=Array.isArray(parsed)?parsed:parsed.sessions;if(!Array.isArray(sessions)||!sessions.length||sessions.length>100)throw Error('Forventede 1–100 træningspas');let clean=sessions.map(s=>{if(!/^\d{4}-\d{2}-\d{2}$/.test(s.date)||!s.title||!s.type)throw Error('Hvert pas skal have date (ÅÅÅÅ-MM-DD), title og type');return {id:uid(),date:s.date,type:String(s.type),title:String(s.title),duration:String(s.duration||''),details:String(s.details||''),status:'planlagt',rpe:'',notes:'',cycleKind:String(s.cycleKind||''),distanceKm:String(s.distanceKm||''),avgSpeed:String(s.avgSpeed||''),avgHr:String(s.avgHr||'')}});data.sessions.push(...clean);save();week=weekStart(clean[0].date);tab='Ugeplan';render();alert(clean.length+' pas importeret')}catch(e){msg.textContent='Import mislykkedes: '+e.message}});on('export',()=>{let blob=new Blob([JSON.stringify({version:1,exportedAt:new Date().toISOString(),...data},null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='SwimBetter-Training-backup-'+today()+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)});let restore=document.getElementById('restore');if(restore)restore.onchange=async()=>{try{let o=JSON.parse(await restore.files[0].text());if(!Array.isArray(o.sessions)||!Array.isArray(o.events))throw Error('Ugyldig backup');if(!confirm('Erstat alle lokale data med denne backup?'))return;data={sessions:o.sessions,events:o.events};save();render();alert('Backup gendannet')}catch(e){alert('Kunne ikke gendanne: '+e.message)}}}render();
</script></body></html>
